    <div class="container">
        <h1>Part 4. Mini Project — Interactive To-Do List</h1>
        
        <div style="display: flex; gap: 40px;">
            <div style="flex: 1;">
                <h2>To-do list</h2>
                <ul id="taskList"></ul>
            </div>
            
            <div style="flex: 1; background: white; padding: 20px; border: 1px solid #ddd;">
                <h2>Add new task</h2>
                <label>Title</label><br>
                <input type="text" id="taskTitle" style="width: 100%; box-sizing: border-box;"><br><br>
                
                <label>Description</label><br>
                <textarea id="taskDesc" rows="5" style="width: 100%; box-sizing: border-box;"></textarea><br><br>
                
                <button id="addTaskBtn" style="background-color: #4a47ff; color: white; border: none; width: 100%; padding: 15px;">Add task</button>
            </div>
        </div>
    </div>

    <script src="part4.js"></script>
